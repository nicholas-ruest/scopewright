<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180"><style>.b{fill:#183f34}.a{fill:#45e2ac;transform-origin:bottom;animation:p 2.4s ease-in-out infinite alternate}.a:nth-child(2){animation-delay:.3s}.a:nth-child(3){animation-delay:.6s}.a:nth-child(4){animation-delay:.9s}@keyframes p{to{opacity:.35;transform:scaleY(.65)}}.t{fill:#dffcf3;font:14px system-ui}</style><rect width="900" height="180" rx="18" fill="#07110f"/><g transform="translate(70 30)"><rect class="a" x="0" y="45" width="130" height="75" rx="8"/><rect class="a" x="185" y="15" width="130" height="105" rx="8"/><rect class="a" x="370" y="60" width="130" height="60" rx="8"/><rect class="a" x="555" y="30" width="130" height="90" rx="8"/><text class="t" x="23" y="143">Scope risk</text><text class="t" x="204" y="143">Integration</text><text class="t" x="399" y="143">Latency</text><text class="t" x="579" y="143">Durability</text></g></svg>