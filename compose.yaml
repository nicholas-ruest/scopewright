services:
  scopewright:
    build: {context: ., dockerfile: Containerfile}
    ports: ["8787:8080"]
    volumes:
      - scopewright-data:/data
      - ${SCOPEWRIGHT_PROBE_ROOT:?source-bound integration root required}:/upstreams:ro
    environment:
      SCOPEWRIGHT_PROBE_ROOT: /upstreams
      SCOPEWRIGHT_RUFLO_CMD: /app/scripts/upstream-runtime/run.sh ruflo
      SCOPEWRIGHT_METAHARNESS_CMD: /app/scripts/upstream-runtime/run.sh metaharness
      SCOPEWRIGHT_AGENTDB_CMD: /app/scripts/upstream-runtime/run.sh agentdb
      SCOPEWRIGHT_SITE_HARNESS_CMD: /app/scripts/upstream-runtime/run.sh site-harness
      SCOPEWRIGHT_SUBLINEAR_CMD: /app/scripts/upstream-runtime/run.sh sublinear
      SCOPEWRIGHT_TOKENECONOMIZER_CMD: /app/scripts/upstream-runtime/run.sh tokeneconomizer
      SCOPEWRIGHT_OTEL_CMD: /app/scripts/upstream-runtime/run.sh otel
    security_opt: ["no-new-privileges"]
    cap_drop: ["ALL"]
volumes: {scopewright-data: {}}
