apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: scopewright
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 8
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PERSONAL_PROJECT/scopewright/app:SOURCE_SHA
          ports: [{containerPort: 8080}]
          env:
            - {name: SCOPEWRIGHT_DATA_PATH, value: /data/evidence.jsonl}
            - {name: SCOPEWRIGHT_UPSTREAM_ROOT, value: /app/upstreams}
          resources:
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: evidence, mountPath: /data}
      volumes:
        - name: evidence
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: false
            volumeAttributes:
              bucketName: AUTHORIZED_EVIDENCE_BUCKET
